<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>

    <h1>Bienvenido al sistema</h1>

    <p>
        Has iniciado sesión correctamente.
    </p>

    {% if messages %}

        {% for message in messages %}

            <p>
                {{ message }}
            </p>

        {% endfor %}

    {% endif %}

    <a href="{% url 'logout' %}">
        Cerrar sesión
    </a>

</body>

</html>
